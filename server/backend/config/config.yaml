server:
  port: "8890"
  mode: "debug"

database:
  path: "./data/zcopy.db"

auth:
  secret_key: "zcopy-secret-key-change-in-production"
  token_expire_hours: 72

storage:
  root_dir: "./storage"

log:
  level: "info"
  dir: "./data/logs"
  max_age_days: 30
  max_size_mb: 500
  max_file_size_mb: 100
